services:
  backend:
    build:
      context: ./backend
    ports:
      - "3003:3003"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3003/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"